[package]
name = "triad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-channel chat on p2panda encrypted spaces"

[[bin]]
name = "triad"
path = "src/main.rs"

[features]
sqlcipher = ["triad-core/sqlcipher"]
default = ["tui", "clipboard", "ws"]
# The full-screen terminal interface (crates/triad/src/tui). Without it,
# chat runs as plain text.
tui = ["dep:ratatui"]
# `/invite` copies the invite to the system clipboard. Without it, or
# with no display, it asks the terminal to copy (OSC 52).
clipboard = ["dep:arboard"]
# `triad serve`: the session on a WebSocket (crates/triad/src/ws, API.md).
ws = ["dep:axum", "dep:hyper", "dep:hyper-util"]
# `triad serve` also serves the web app (web/) at `/`, embedded from
# web/dist by build.rs. Not a default: it needs `pnpm -C web build` first.
# Releases (scripts/release.sh, triad-release) always build with it, so the
# web app ships inside the binary and with every update.
web = ["ws"]

[dependencies]
triad-core = { workspace = true }
triad-probe = { workspace = true }
triad-agent = { workspace = true }
triad-update = { workspace = true }
reqwest = { workspace = true }
p2panda = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
ratatui = { workspace = true, optional = true }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# The MCP fixture server (examples/mcp_fixture.rs) for the bot tests.
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
