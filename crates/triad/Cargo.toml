[package]
name = "triad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-channel chat on p2panda encrypted spaces"

[[bin]]
name = "triad"
path = "src/main.rs"

[features]
sqlcipher = ["triad-core/sqlcipher"]
# The full-screen terminal interface (crates/triad/src/tui). Filled in by
# the next step; until then chat runs as plain text either way.
tui = []

[dependencies]
triad-core = { workspace = true }
triad-probe = { workspace = true }
triad-agent = { workspace = true }
p2panda = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# The MCP fixture server (examples/mcp_fixture.rs) for the bot tests.
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
