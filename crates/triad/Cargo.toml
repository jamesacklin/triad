[package]
name = "triad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-channel chat on p2panda encrypted spaces"

[[bin]]
name = "triad"
path = "src/main.rs"

[features]
sqlcipher = ["triad-core/sqlcipher"]
default = ["tui", "clipboard"]
# The full-screen terminal interface (crates/triad/src/tui). Without it,
# chat runs as plain text.
tui = ["dep:ratatui"]
# `/invite` copies the invite to the system clipboard. Without it, or
# with no display, it asks the terminal to copy (OSC 52).
clipboard = ["dep:arboard"]

[dependencies]
triad-core = { workspace = true }
triad-probe = { workspace = true }
triad-agent = { workspace = true }
triad-update = { workspace = true }
p2panda = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
ratatui = { workspace = true, optional = true }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# The MCP fixture server (examples/mcp_fixture.rs) for the bot tests.
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
