[workspace]
resolver = "3"
members = ["crates/triad-core", "crates/triad-probe", "crates/triad-agent", "crates/triad", "crates/triad-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Pinned by the spec (exact versions).
p2panda = "=0.8.0"
p2panda-core = "=0.8.0"
iroh = "=1.4.1"

# Supporting crates.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio-stream = "0.1"
tempfile = "3"

# Long messages (crates/triad-core/src/long.rs). Already in the build through
# p2panda-encryption and other dependencies; named here at the same versions.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
serde_bytes = "0.11"

# Bots (HARNESS-PLAN.md). Pinned exactly. `rig-core` and `rig-reqwest` may
# only be named in triad-agent's brain.rs and `rmcp` only in its mcp.rs.
rig-core = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
# TLS for the bots without a second crypto provider: reqwest with no provider,
# rustls on ring (as iroh already uses), bundled roots for hosts with no store.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-root-certs = "1"

triad-core = { path = "crates/triad-core" }
triad-probe = { path = "crates/triad-probe" }
triad-agent = { path = "crates/triad-agent" }
